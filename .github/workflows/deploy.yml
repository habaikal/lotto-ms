name: 🚀 Deploy to GitHub Pages

on:
  push:
    branches:
      - main      # main 브랜치에 push 될 때 자동 실행
  workflow_dispatch:  # 수동 실행 버튼도 활성화

# GitHub Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 여러 배포가 실행되지 않도록 제한
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── 1단계: 빌드 ──────────────────────────────────────────────
  build:
    name: 📦 Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📥 Install dependencies
        working-directory: frontend
        run: npm ci

      - name: 🔨 Build (GitHub Pages base URL 적용)
        working-directory: frontend
        env:
          # GitHub Pages URL 형식: https://<owner>.github.io/<repo>/
          VITE_BASE_URL: /lotto-ms/
        run: npm run build

      - name: ⚙️ Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  # ── 2단계: 배포 ──────────────────────────────────────────────
  deploy:
    name: 🌐 Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
